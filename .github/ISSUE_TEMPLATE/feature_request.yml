name: ✨ Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["Feature Request"]
assignees:
     - AzPepoze
projects:
     - AzPepoze/1
body:
     - type: markdown
       attributes:
            value: |
                 Thanks for taking the time to suggest a new feature!
     - type: textarea
       id: feature-description
       attributes:
            label: What feature would you like to see?
            description: Describe the feature you'd like in detail, including its benefits
            placeholder: I would like to have...
       validations:
            required: true
     - type: textarea
       id: problem-solution
       attributes:
            label: What problem does this feature solve? (Optional)
            description: Describe the current problem this feature would address or situations where it would be useful
     - type: textarea
       id: additional-context
       attributes:
            label: Additional context (Optional)
            description: Add any other context, screenshots, mockups, or relevant links about the feature request here
