name: build-release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Validate Release Version
        run: |
          VERSION=$(jq -r '.version' extension.config.json)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME must match v$VERSION from extension.config.json"
            exit 1
          fi

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build and Pack Extension
        run: bun run release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            out/release/*.zip
          draft: false
          prerelease: false
